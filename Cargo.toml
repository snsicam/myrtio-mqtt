[package]
name = "myrtio-mqtt"
description = "Async MQTT client library for std (Linux) environments"
version = "0.3.0"
publish = true
license = "MIT"
edition = "2024"
rust-version = "1.90"

[features]
default = []
v5 = []
defmt = ["dep:defmt"]
log = ["dep:log"]

[dependencies]
log = { version = "0.4", optional = true }
heapless = "0.9"
# std 时间源：embassy-time 在 std 下由系统时钟驱动，保活/tick 照常工作（见 rv1106-mqtt-client 注释）。
embassy-time = { version = "0.5.0", features = ["std", "generic-queue-8"] }
embassy-sync = "0.7.2"
defmt = { version = "0.3", optional = true }
